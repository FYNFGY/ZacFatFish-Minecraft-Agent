# ============================================================================
# ZFF MC —— DSH bundle patch（插件**自带**的挂载声明）
# ============================================================================
# 这就是"标准 DSH 插件"的样子：包自己声明要往 profile 的配置树里插什么，
# profile 只要在 `dsh.profile.bundles` 里列出本包名即生效，不必手改 profile 的 patch：
#
#   dsh plugin --profile desktop add link:D:/mc/zff-mc
#
# 组成顺序（与 whale_craft 的 cordis.patch.yml 同一套规矩）：
#   每个 bundle 的 patch 按 `dsh.profile.bundles` 顺序叠 → 再叠 profile 自己的 cordis.patch.yml
#   （只有 profile 那一层是**热重载**的；bundle 层要重启才会重新组装。）
# ============================================================================

- insert:
    - id: zff-mc
      name: '@local/zff-mc'

# ────────────────────────────────────────────────────────────────────────────
# Minecraft 控制通道（MCP client）：工具会以 `mcp__mc__*` 出现。
#
# 🔴 本机**默认注释掉**：`C:\Users\ALIENWARE\.dsh\profiles\desktop\cordis.patch.yml`
#    已经有一条 `mc-control`（serverName: mc，同为 127.0.0.1:57610/mcp）。
#    bundle 层先叠、profile 层后叠，再插一条同名 serverName 会让同一批工具
#    **注册两遍**（`mcp__mc__*` 重名），所以这里只留模板。
#
# 换到**没有 mc-control 的 profile** 时，把下面这段取消注释即可（值与本机 profile 一致）：
#
# - insert:
#     - id: zff-mc-mcp
#       name: '@deepseek-ai/dsh-mcp-client'
#       config:
#         serverName: mc
#         transport: streamable-http
#         url: http://127.0.0.1:57610/mcp
#         toolCallTimeoutMs: 600002
#         failOnStartupError: false
#         reconnect:
#           enabled: true
#           initialDelayMs: 500
#           maxDelayMs: 30000
#           maxAttempts: 10
#
# 起 MCP server 的命令见工作区 `start-mcp.ps1`（或 `start-all.ps1` 全起）。
# ────────────────────────────────────────────────────────────────────────────
